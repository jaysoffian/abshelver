[project]
name = "abshelver"
version = "0.1.0"
description = "Shelve new audiobooks into an Audiobookshelf library and keep it tidy"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "jinja2",
    "pydantic>=2",
    "python-multipart",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest>=9.1.1",
    "ruff",
    "ty>=0.0.42",
]

[project.scripts]
abshelver = "abshelver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["abshelver"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4",
    "SIM", "PL", "RUF", "PIE", "RET", "PERF", "FURB",
    "LOG", "G", "T20", "PTH", "TID",
]
ignore = ["E501", "PLR09", "PLR2004", "PLW2901", "SIM108", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"abshelver/cli.py" = ["T201"]
"tests/*" = ["RUF001", "PLC0415", "RUF059"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
