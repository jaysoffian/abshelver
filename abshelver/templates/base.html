<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}abshelver{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='4' height='12' rx='1' fill='%23c66'/%3E%3Crect x='6' y='2' width='4' height='12' rx='1' fill='%236a8'/%3E%3Crect x='11' y='4' width='4' height='10' rx='1' fill='%2368c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ static_url('abshelver.css') }}">
</head>
<body data-page="{{ page }}">
<header class="top">
  <span class="brand">abshelver</span>
  <nav>
    <a href="/"{% if page == 'imports' %} class="current"{% endif %}>Import</a>
    <a href="/organize"{% if page == 'organize' %} class="current"{% endif %}>Organize</a>
  </nav>
  {% if abs_url %}<a class="ext" href="{{ abs_url }}" target="_blank" rel="noopener">Audiobookshelf ↗</a>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="{{ static_url('abshelver.js') }}"></script>
</body>
</html>
