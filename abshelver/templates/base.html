<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}abshelver{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ static_url('icon.svg') }}">
<style>
@font-face { font-family: "Source Sans Pro"; font-weight: 400; font-display: swap; src: url({{ static_url('fonts/SourceSansPro-Regular.woff2') }}) format("woff2"); }
@font-face { font-family: "Source Sans Pro"; font-weight: 600; font-display: swap; src: url({{ static_url('fonts/SourceSansPro-SemiBold.woff2') }}) format("woff2"); }
@font-face { font-family: "Ubuntu Mono"; font-weight: 400; font-display: swap; src: url({{ static_url('fonts/UbuntuMono-Regular.woff2') }}) format("woff2"); }
</style>
<link rel="stylesheet" href="{{ static_url('abshelver.css') }}">
</head>
<body data-page="{{ page }}">
<header class="top">
  <a class="logo" href="/"><img src="{{ static_url('icon.svg') }}" alt="" width="40" height="40"></a>
  <a class="brand" href="/">abshelver</a>
  <nav>
    <a href="/"{% if page == 'imports' %} class="current"{% endif %}>Import</a>
    <a href="/organize"{% if page == 'organize' %} class="current"{% endif %}>Organize</a>
    <a href="/library"{% if page == 'library' %} class="current"{% endif %}>Library</a>
  </nav>
  {% if abs_url %}<a class="ext" href="{{ abs_url }}" target="_blank" rel="noopener">Audiobookshelf ↗</a>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="{{ static_url('abshelver.js') }}"></script>
</body>
</html>
